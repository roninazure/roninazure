name: ⏱️ README Timestamp Auto-Update

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  update-timestamp:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v3

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 🔄 Run timestamp updater
        run: python3 .github/scripts/update_readme_timestamp.py

      - name: 📤 Commit & Push changes
        run: |
          git config user.name "ScottGPT Bot"
          git config user.email "roninazure@users.noreply.github.com"
          git add README.md
          git commit -m "📆 Auto-update README timestamp" || echo "No changes to commit"
          git push
